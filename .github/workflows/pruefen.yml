name: Pruefen
on:
  push:
    branches: [main]
    paths-ignore: ['svg/**', 'svg-dg/**', 'index.json', 'katalog.html']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pruefen
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Datenbank pruefen
        run: python3 werkzeug/pruefen.py
      - name: Bilder und Katalog neu erzeugen
        if: github.event_name != 'pull_request'
        run: |
          python3 werkzeug/export.py
          git config user.name "Galopp-Rennfarben"
          git config user.email "sebastian@sebweiss.com"
          git add -A svg svg-dg index.json katalog.html
          git diff --cached --quiet || { git commit -q -m "Bilder neu erzeugt"; git push -q; }
